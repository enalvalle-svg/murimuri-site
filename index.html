<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Muri Muri — Café</title>
  <meta name="description" content="Muri Muri — café de especialidad en Coyoacán, CDMX." />

  <link id="favicon" rel="icon" href="assets/logo.png" type="image/png" />
  <link id="appleicon" rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --accent:#eaad96;
      --accent-deep:#d98a6e;
      --sage:#a9b98f;
      --ink:#2b2420;
      --muted:#8a7b70;
      --max:1180px;
      --bg:#fff3ea;
      --card:#fffaf5;
      --radius:22px;
    }
    @font-face{
      font-family:'Marfa';
      src:url('assets/fonts/ABCMARFA-SEMIBOLD-TRIAL.otf') format('opentype');
      font-weight:700; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:'MuriSans';
      src:url('assets/fonts/Regular.ttf') format('truetype');
      font-weight:400; font-style:normal; font-display:swap;
    }

    *{ box-sizing:border-box }
    html, body { height:100%; }
    body{
      margin:0; color:var(--ink);
      font-family:'MuriSans', Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height:1.65; background:var(--bg);
      overscroll-behavior:none;
    }
    h1,h2,h3,.display{
      font-family:'Marfa','Space Grotesk',Inter,sans-serif;
      letter-spacing:.01em;
    }
    a{ color:inherit; text-decoration:none }
    .wrap{ max-width:var(--max); margin:0 auto; padding:0 20px; }

    header{
      position:sticky; top:0; z-index:50;
      background:rgba(255,243,234,.88);
      backdrop-filter:saturate(1.2) blur(10px);
      border-bottom:1px solid rgba(43,36,32,.08);
    }
    .nav{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; height:68px; gap:14px; }
    .nav a{ font-weight:600 }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand img{
      height:clamp(30px, 6vw, 40px); width:auto; display:block;
      object-fit:contain;
    }
    #mailLink{
      color:var(--accent-deep); font-weight:700;
      padding:6px 14px; border-radius:999px;
      background:rgba(234,173,150,.16);
      transition:background .2s ease, transform .2s ease;
    }
    #mailLink:hover{ background:rgba(234,173,150,.3); transform:translateY(-1px); }
    .igLink{
      justify-self:end;
      padding:8px 16px; border-radius:999px;
      background:var(--accent); color:#2b2420; font-weight:700;
      box-shadow:0 4px 12px rgba(234,173,150,.4);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .igLink:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(234,173,150,.5); }

    #heroWrap{ position:relative; }

    .playfield{
      position:relative; width:100%;
      height:calc(78dvh - 30px);
      overflow:hidden; background:var(--bg);
      border-radius:var(--radius);
      margin:0 auto; max-width:calc(var(--max) - 40px);
      cursor:default;
    }

    .floatLetter{
      position:absolute;
      width:60px; height:auto;
      user-select:none;
      will-change:transform;
      filter:drop-shadow(0 4px 10px rgba(43,36,32,.18));
      transition:filter .3s ease;
      pointer-events:auto;
    }
    .floatLetter:hover{ filter:drop-shadow(0 6px 16px rgba(43,36,32,.3)) brightness(1.05); }

    .photo{
      position:absolute; object-fit:cover; background:#fff;
      border:4px solid #fff; border-radius:14px;
      box-shadow:0 10px 26px rgba(43,36,32,.16);
      opacity:0; transform:scale(.92) rotate(0deg);
      transition:opacity .6s ease, transform .6s ease; z-index:1; pointer-events:none;
    }
    .photo.show{ opacity:1; transform:scale(1); }

    .dock{
      position:sticky; bottom:0; z-index:40;
      background:rgba(255,243,234,.92);
      border-top:1px solid rgba(43,36,32,.08);
      backdrop-filter:saturate(1.2) blur(10px);
      margin-top:14px;
    }
    .dock .row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      align-items:center; justify-items:center;
      gap:10px; padding:18px 20px; min-height:76px;
    }
    .dock a, .dock span {
      font-weight:700; text-align:center;
      padding:8px 14px; border-radius:999px;
      transition:background .2s ease, transform .2s ease;
    }
    .dock a:hover{ background:rgba(234,173,150,.18); transform:translateY(-1px); }
    .dock small{ display:block; color:var(--muted); font-size:.62rem; margin-top:2px; font-weight:600; letter-spacing:.02em; }
    .icon{ width:18px; height:18px; vertical-align:-3px; margin-right:6px; }

    footer{ padding:36px 0 48px; }
    .footer-grid{ display:grid; gap:18px; grid-template-columns:2fr 1fr 1fr; text-align:center; }
    .tiny{ font-size:.92rem; color:var(--muted) }
    @media (max-width:820px){ .footer-grid{ grid-template-columns:1fr } }

    .modal{
      position:fixed; inset:0;
      background:rgba(43,36,32,.55);
      display:none; align-items:center; justify-content:center;
      padding:4vh 4vw;
      z-index:80;
    }
    .modal.open{display:flex}
    .sheet{
      background:#fff; border-radius:20px;
      width:min(92vw, 980px);
      box-shadow:0 24px 60px rgba(43,36,32,.3);
      overflow:hidden;
    }
    .sheet .content{ position:relative }
    .viewer{ position:relative; width:100%; background:#fff }
    .viewer .fit{ height:min(88vh, 820px); width:100%; }
    @supports (height: 1dvh){ .viewer .fit{ height:min(88dvh, 820px); } }
    .viewer iframe, .viewer img{ width:100%; height:100%; border:0; display:block; }
    .viewer img{ object-fit:contain; background:#fff; }
    .viewer .chrome{
      position:absolute; top:8px; left:8px; right:8px;
      display:flex; justify-content:space-between; pointer-events:none;
    }
    .viewer .btnIcon{
      pointer-events:auto;
      background:rgba(255,255,255,.95);
      border:1px solid rgba(43,36,32,.14);
      border-radius:999px;
      width:40px; height:40px;
      display:grid; place-items:center;
      font-size:22px; font-weight:800;
      color:var(--accent-deep);
    }
    @media (max-width:640px){ .viewer .btnIcon{ width:44px; height:44px; font-size:24px } }
    .viewer .group{display:flex; gap:8px}

    .hiddenPage{ display:none; padding:40px 0 60px; background:var(--bg); }
    .hiddenPage .title{ font-family:'Marfa','Space Grotesk',Inter,sans-serif; font-size:2rem; margin:0 0 12px; }
    .hiddenPage .lead{ color:#333; margin:0 0 18px; }

    #addrLink { text-decoration:none; }
    #addrText{
      text-decoration:underline;
      text-underline-offset:3px;
      text-decoration-thickness:2px;
    }

    .gameCard{
      background:var(--card); border-radius:var(--radius);
      padding:22px; box-shadow:0 8px 24px rgba(43,36,32,.08);
      text-align:center;
    }
    .gameCard h3{ margin:0 0 4px; color:var(--accent-deep); }
    #runner{ border-radius:14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="#top">
        <img id="brandLogo" src="assets/logo.png" alt="Muri Muri" />
      </a>
      <a id="mailLink" href="mailto:hola@murimuri.coffee" rel="noopener">

  <div id="heroWrap">

    </section>

    <div class="dock">

          <span id="addrText">Dirección</span>
          <small>(CÓMO LLEGAR)</small>
        </a>
        <a href="#" id="menuLink">MENÚ</a>
        <a id="waLink" href="https://wa.me/525669657508" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.1 15.9c-.3.8-1.6 1.6-2.3 1.7-.6.1-1.4.1-2.3-.1a9.8 9.8 0 0 1-4.7-2.6A10.7 10.7 0 0 1 5.9 9c-.2-1 .2-1.7.5-2.1.3-.4.7-.5 1.1-.5h.8c.2 0 .5.2.6.6l.7 1.7c.1.3 0 .6-.1.8l-.4.6-.2.3c-.1.1 0 .4.1.6.3.6.9 1.4 1.6 2.1.7.7 1.5 1.3 2.1 1.6.2.1.5.2.6.1l.3-.2.6-.4c.2-.1.5-.2.8-.1l1.7.7c.4.1.6.4.6.6 0 .4-.1.8-.2 1z" fill="#2b2420"/>
            <circle cx="12" cy="12" r="10" fill="none" stroke="#2b2420" stroke-width="1.5"/>

  <div id="locked" style="display:none;">
    <section class="wrap" style="padding:36px 0 40px">
      <div class="gameCard">
        <h3>¿Nos acompañas por un cafecito?</h3>

        <canvas id="runner" width="960" height="260" aria-label="Juego: salta con espacio o toque"

    <div class="sheet"><div id="modalContent" class="content"></div></div>
  </div>

  <script id="site-config" type="application/json">
  {

    "logo2": "assets/logo.png",

    },

    },
    "email": "hola@murimuri.coffee",

    ],
    "photos": [
      "assets/foto1.jpg","assets/foto2.jpg","assets/foto3.jpg","assets/foto4.jpg",

  <script>
    const $ = (sel, root=document) => root.querySelector(sel);
    const CONFIG = JSON.parse(($('#site-config')||{}).textContent || '{}');
    const setIf = (el, fn) => el && fn(el);

    setIf($('#y'), el => el.textContent = new Date().getFullYear());

    (function applyConfig(){
      setIf($('#brandLogo'), el => el.src = CONFIG.logo2 || el.src);
      setIf($('#favicon'), el => el.href = CONFIG.logo || el.href);
      setIf($('#appleicon'), el => el.href = CONFIG.logo || el.href);

      setIf($('#hours'), el => el.textContent = CONFIG.hours || el.textContent);
      setIf($('#addrText'), el => el.textContent = (CONFIG.address && CONFIG.address.text) || el.textContent);
      setIf($('#addrLink'), el => { el.href = (CONFIG.address && CONFIG.address.mapsUrl) || '#'; });

      const wa = CONFIG.whatsapp?.link || 'https://wa.me/525669657508';
      setIf($('#waLink'), el => { el.href = wa; });

      const mail = CONFIG.email || 'hola@murimuri.coffee';
      setIf($('#mailLink'), el => el.href = 'mailto:'+mail);
    })();

    const modal = $('#modal');
    const content = $('#modalContent');
    modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.classList.remove('open'); });

    function openMenu(start=0){
      const MENUS = Array.isArray(CONFIG.menu) && CONFIG.menu.length ? CONFIG.menu : [];
      if (!MENUS.length) return;

      modal.classList.add('open');
      content.innerHTML = `
        <div class="viewer">
          <div class="chrome">
            <div class="group">
              <button class="btnIcon" id="mPrev"  aria-label="Anterior">‹</button>
              <button class="btnIcon" id="mNext"  aria-label="Siguiente">›</button>
            </div>
            <button class="btnIcon" id="mClose" aria-label="Cerrar">×</button>
          </div>
          <div class="fit"><iframe id="menuPdf"></iframe></div>
        </div>
      `;

      const pdf = content.querySelector('#menuPdf');
      let idx = start;

      function show(i){
        idx = (i + MENUS.length) % MENUS.length;
        pdf.src = MENUS[idx] + '#zoom=page-fit&view=Fit&toolbar=0&navpanes=0&scrollbar=0&statusbar=0&messages=0';
      }
      content.querySelector('#mClose').onclick = ()=> modal.classList.remove('open');
      content.querySelector('#mPrev').onclick  = ()=> show(idx-1);
      content.querySelector('#mNext').onclick  = ()=> show(idx+1);

      const onKey = (e)=>{ if(e.key==='Escape'){ modal.classList.remove('open'); }
                           if(e.key==='ArrowLeft')  show(idx-1);
                           if(e.key==='ArrowRight') show(idx+1); };
      document.addEventListener('keydown', onKey, { once:false });

      let sx=0, fit=content.querySelector('.fit');
      fit.addEventListener('touchstart', e=> sx=e.changedTouches[0].clientX, {passive:true});
      fit.addEventListener('touchend',   e=>{ const dx=e.changedTouches[0].clientX - sx; if(Math.abs(dx)>40) (dx>0 ? show(idx-1) : show(idx+1)); }, {passive:true});

      show(idx);
    }
    $('#menuLink')?.addEventListener('click', (e)=>{ e.preventDefault(); openMenu(0); });

    // Flowing branded letter glyphs (m, u, r, i) spelling MURIMURI, cursor-reactive
    (function initFlowingLetters(){
      const field = $('#playfield'); if(!field) return;
      const glyphMap = {
        m: 'assets/letterm.png',
        u: 'assets/letteru.png',
        r: 'assets/letterr.png',
        i: 'assets/letteri.png'
      };
      const letterKeys = ['m','u','r','i'];
      const TOTAL_LETTERS = 18;
      const sequence = Array.from({length: TOTAL_LETTERS}, () => letterKeys[Math.floor(Math.random()*letterKeys.length)]);

      const letters = sequence.map((ch) => {
        const img = document.createElement('img');
        img.className = 'floatLetter';
        img.src = glyphMap[ch];
        img.alt = ch;
        img.style.cursor = 'pointer';
        field.appendChild(img);
        return img;
      });

      const state = letters.map(() => ({
        x: Math.random(), y: Math.random(),
        vx: (Math.random()-0.5) * 0.0004,
        vy: (Math.random()-0.5) * 0.0004,
        driftAngle: Math.random()*Math.PI*2,
        driftSpeed: 0.00006 + Math.random()*0.00012,
        size: 34 + Math.random()*58
      }));

      const mouse = { x:-9999, y:-9999, active:false };
      field.addEventListener('mousemove', (e)=>{
        const r = field.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
        mouse.active = true;
      });
      field.addEventListener('mouseleave', ()=>{ mouse.active = false; });
      field.addEventListener('touchmove', (e)=>{
        if(!e.touches[0]) return;
        const r = field.getBoundingClientRect();
        mouse.x = e.touches[0].clientX - r.left; mouse.y = e.touches[0].clientY - r.top;
        mouse.active = true;
      }, {passive:true});
      field.addEventListener('touchend', ()=>{ mouse.active = false; });

      function tick(){
        const fw = field.clientWidth, fh = field.clientHeight;
        if(fw && fh){
          state.forEach((s, i) => {
            let px = s.x*fw, py = s.y*fh;

            s.driftAngle += (Math.random()-0.5) * 0.03;
            s.vx += Math.cos(s.driftAngle) * s.driftSpeed;
            s.vy += Math.sin(s.driftAngle) * s.driftSpeed;

            if(mouse.active){
              const dx = px - mouse.x, dy = py - mouse.y;
              const dist = Math.sqrt(dx*dx + dy*dy) || 1;
              const radius = 170;
              if(dist < radius){
                const force = (1 - dist/radius) * 0.9;
                s.vx += (dx/dist) * force * 0.025;
                s.vy += (dy/dist) * force * 0.025;
              }
            }

            s.vx *= 0.965; s.vy *= 0.965;

            px += s.vx * fw; py += s.vy * fh;

            const margin = s.size;
            const bounce = 0.85;
            if(px < 0){ px = 0; s.vx *= -bounce; }
            if(px > fw - margin){ px = fw - margin; s.vx *= -bounce; }
            if(py < 0){ py = 0; s.vy *= -bounce; }
            if(py > fh - margin){ py = fh - margin; s.vy *= -bounce; }

            s.x = px/fw; s.y = py/fh;

            letters[i].style.left = px + 'px';
            letters[i].style.top  = py + 'px';
            letters[i].style.width = s.size + 'px';
          });
        }
        requestAnimationFrame(tick);
      }

      function start(){
        if(field.clientWidth && field.clientHeight){
          state.forEach((s,i)=>{
            letters[i].style.left = (s.x*field.clientWidth) + 'px';
            letters[i].style.top  = (s.y*field.clientHeight) + 'px';
            letters[i].style.width = s.size + 'px';
          });
          requestAnimationFrame(tick);
        } else requestAnimationFrame(start);
      }
      start();

      let gameInited = false;
      letters.forEach(el => {
        el.addEventListener('click', ()=>{
          const locked = $('#locked');
          if(locked) locked.style.display = 'block';
          if(!gameInited && typeof initRunner==='function'){ initRunner(); gameInited = true; }
          locked && locked.scrollIntoView({ behavior:'smooth' });
        });
      });
    })();

    (function initMultiSlideshow(){
      const field = $('#playfield'); if(!field) return;
      const PHOTO_URLS = Array.isArray(CONFIG.photos) && CONFIG.photos.length ? CONFIG.photos : [];
      const LIFESPAN = 10000;
      const MAX_VISIBLE = 2;
      const SPAWN_EVERY = Math.max(200, Math.floor(LIFESPAN / MAX_VISIBLE));

      const nodes = PHOTO_URLS.map((src, i) => {
        const img = document.createElement('img');
        img.className = 'photo';
        img.src = src; img.alt = 'Foto ' + (i+1);
        field.appendChild(img);
        return img;
      });

      const rint = (min, max) => Math.floor(Math.random()*(max-min+1)) + min;

      function randomSize(){
        const isPhone = matchMedia('(max-width: 640px)').matches;
        const bucket = rint(0, 2);
        let w = isPhone ? (bucket===0 ? 140 : bucket===1 ? 170 : 200)
                        : (bucket===0 ? 200 : bucket===1 ? 250 : 300);
        w += rint(-16, 24);
        const aspect = 4/3, h = Math.round(w / aspect);
        return { w, h };
      }
      function placeRandom(img, w, h){
        const maxX = Math.max(0, field.clientWidth  - w);
        const maxY = Math.max(0, field.clientHeight - h);
        img.style.left = rint(0, maxX) + 'px';
        img.style.top  = rint(0, maxY) + 'px';
        img.style.width  = w + 'px';
        img.style.height = h + 'px';
        img.style.transform = `rotate(${rint(-4,4)}deg)`;
      }
      function shuffle(a){
        const arr = a.slice();
        for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
        return arr;
      }

      let order = shuffle([...nodes.keys()]);
      let cursor = 0, lastIdx = -1;

      function nextIndex(){
        if(cursor >= order.length){
          order = shuffle([...nodes.keys()]);
          if(order.length>1 && order[0]===lastIdx){ [order[0],order[1]]=[order[1],order[0]]; }
          cursor = 0;
        }
        lastIdx = order[cursor++];
        return lastIdx;
      }

      const active = new Set();

      function spawnOne(){
        while(active.size >= Math.min(MAX_VISIBLE, nodes.length)){
          const first = active.values().next().value;
          nodes[first].classList.remove('show');
          active.delete(first);
        }
        let idx = nextIndex();
        let guard = 0;
        while(active.has(idx) && guard++ < nodes.length){
          idx = nextIndex();
        }
        const img = nodes[idx];
        active.add(idx);

        const {w,h} = randomSize(); placeRandom(img, w, h);
        requestAnimationFrame(()=> img.classList.add('show'));

        setTimeout(()=>{ img.classList.remove('show'); active.delete(idx); }, LIFESPAN);
      }

      function start(){
        if(field.clientWidth && field.clientHeight){
          for(let i=0;i<Math.min(MAX_VISIBLE, nodes.length);i++){ setTimeout(spawnOne, i*300); }
          setInterval(()=> nodes.length && spawnOne(), SPAWN_EVERY);
        } else requestAnimationFrame(start);
      }
      if(nodes.length) start();

      addEventListener('resize', ()=>{
        active.forEach(idx=>{
          const img = nodes[idx];
          placeRandom(img, img.offsetWidth||240, img.offsetHeight||180);
        });
      });
    })();

    function initRunner(){
      const cvs = document.getElementById('runner'); const ctx = cvs.getContext('2d');
      let running = true; const G=0.6, JUMP=-11; const ground = cvs.height - 28;
      const player = {x:80, y:ground, vy:0, w:56, h:56}; let obstacles=[];
      const sprite=new Image(); sprite.src='assets/recurso.png';
      const bean=new Image(); bean.src='assets/bean.png';

      function reset(){ player.y=ground; player.vy=0; obstacles=[]; running=true; }
      function spawn(){ const size=26+Math.random()*14; obstacles.push({x:cvs.width+20,y:ground,w:size,h:size,size}); }
      let spawnGap=0;

      function draw(){
        ctx.clearRect(0,0,cvs.width,cvs.height);
        ctx.strokeStyle='rgba(43,36,32,.15)'; ctx.beginPath(); ctx.moveTo(0, ground+2); ctx.lineTo(cvs.width, ground+2); ctx.stroke();
        if(sprite.complete && sprite.naturalWidth){ ctx.drawImage(sprite, player.x-14, player.y-player.h, player.w, player.h); }
        else{ ctx.fillStyle='#935c4d'; ctx.fillRect(player.x, player.y-player.h, player.w, player.h); }
        obstacles.forEach(o=>{
          if(bean.complete && bean.naturalWidth){ ctx.drawImage(bean, o.x-o.size/2, o.y-o.size, o.size, o.size); }
          else{
            ctx.fillStyle='#6b3e2e';
            ctx.beginPath(); ctx.ellipse(o.x, o.y-o.size/2, o.size/2.4, o.size/1.9, 0.4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.beginPath();
            ctx.moveTo(o.x-o.size/4, o.y-o.size); ctx.quadraticCurveTo(o.x, o.y-o.size/2, o.x-o.size/6, o.y); ctx.stroke();
          }
        });
      }
      function update(){
        if(!running) return;
        player.vy += G; player.y += player.vy; if(player.y>ground){ player.y=ground; player.vy=0; }
        const speed=5.2; obstacles.forEach(o=> o.x -= speed); obstacles = obstacles.filter(o=> o.x + o.w > 0);
        spawnGap -= speed; if(spawnGap<=0){ spawn(); spawnGap = 240 + Math.random()*220; }
        for(const o of obstacles){ if(player.x<o.x+o.w && player.x+player.w>o.x && player.y>o.y-o.h){ running=false; } }
      }
      (function loop(){ update(); draw(); requestAnimationFrame(loop); })();
      function jump(){ if(player.y===ground){ player.vy=JUMP; } }
      cvs.addEventListener('pointerdown', jump);
      document.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); jump(); } if(e.code==='Enter' && !running){ reset(); } });
      cvs.addEventListener('click', ()=>{ if(!running){ reset(); } });
    }

    (function(){
      const el = document.getElementById('totalVisits');
      if (!el) return;
      const ns  = 'murimuri.coffee';
      const key = 'homepage_visits';
      fetch(`https://api.countapi.xyz/hit/${encodeURIComponent(ns)}/${encodeURIComponent(key)}`)
        .then(r => r.json())
        .then(d => { el.textContent = Number(d.value).toLocaleString('es-MX'); })
        .catch(() => { el.textContent = '—'; });
    })();
  </script>
</body>
