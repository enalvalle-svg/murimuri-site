<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café — Muri Muri</title><link rel="icon" href="../assets/logo.png"><style>@font-face{font-family:Marfa;src:url('../assets/fonts/ABCMARFA-SEMIBOLD-TRIAL.otf')}@font-face{font-family:MuriSans;src:url('../assets/fonts/Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#fff1eb;color:#2f7189;font-family:MuriSans,Arial,sans-serif}a{color:inherit}.wrap{max-width:900px;margin:auto;padding:0 22px}header{border-bottom:1px solid #2f718944}.bar{height:68px;display:flex;align-items:center;justify-content:space-between}.bar img{height:34px}.bar a{text-decoration:none;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}.hero{padding:62px 0 34px}.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.11em}.hero h1{font-family:Marfa,sans-serif;text-transform:uppercase;font-size:clamp(3rem,10vw,7rem);line-height:.86;margin:10px 0}.subtitle{font-size:1.15rem}.label{margin-top:28px;background:#f7cd99;color:#ef8f78;border:1px solid currentColor;padding:20px}.label-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}.row{padding:11px 0;border-bottom:1px solid currentColor}.row b{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.story{padding:42px 0}.story section{border-top:1px solid #2f718944;padding:26px 0;display:grid;grid-template-columns:180px 1fr;gap:26px}.story h2{font-family:Marfa,sans-serif;text-transform:uppercase;font-size:1.4rem;line-height:1;margin:0}.story p{margin:0;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid currentColor;border-radius:999px;padding:7px 11px;font-size:.78rem}.timeline{display:grid;gap:12px}.yr{display:grid;grid-template-columns:70px 1fr;gap:12px}.yr b{font-family:Marfa,sans-serif}.back{display:inline-flex;margin:20px 0 50px;text-decoration:none;border:1px solid currentColor;border-radius:999px;padding:9px 14px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}@media(max-width:620px){.story section{grid-template-columns:1fr}.label-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap bar"><a href="../index.html"><img src="../assets/logo.png" alt="Muri Muri"></a><a href="../archive/">Archivo de cafés</a></div></header><main id="app" class="wrap"></main><script>const app=document.getElementById('app'),q=new URLSearchParams(location.search).get('coffee');const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};function render(c){document.title=`${c.name} — Muri Muri`;const tags=(c.tastingNotes||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');const hist=(c.history||[]).map(x=>`<div class="yr"><b>${esc(x.year)}</b><span>${esc(x.summary)}</span></div>`).join('');app.innerHTML=`<section class="hero"><p class="eyebrow">${c.status==='current'?'Café actual':'Archivo'} · ${esc(c.service||'Muri Muri')}</p><h1>${esc(c.name)}</h1><p class="subtitle">${esc(c.producer)} · ${esc(c.origin)}</p><div class="label"><div class="label-grid"><div class="row"><b>Productor</b>${esc(c.producer)}</div><div class="row"><b>Comunidad</b>${esc(c.community)}</div><div class="row"><b>Variedad</b><i>${esc(c.variety)}</i></div><div class="row"><b>Proceso</b>${esc(c.process)}</div><div class="row"><b>Altitud</b>${esc(c.altitudeMeters)} msnm</div><div class="row"><b>Cosecha</b>${esc(c.harvestYear)}</div></div></div></section><div class="story"><section><h2>En taza</h2><div class="tags">${tags||'<span>Por documentar</span>'}</div></section><section><h2>Origen</h2><p>${esc(c.community)} forma parte de ${esc(c.origin)}, ${esc(c.country)}. Esta ficha crecerá con información verificada sobre territorio, contexto productivo y cosecha.</p></section><section><h2>La relación</h2><p>${esc(c.relationship||'Estamos documentando la relación detrás de este café.')}</p></section><section><h2>Historia</h2><div class="timeline">${hist||'<p>Primera cosecha documentada.</p>'}</div></section></div><a class="back" href="../archive/">← Volver al archivo</a>`}fetch('../archive/coffees.json').then(r=>r.json()).then(d=>{const c=d.coffees&&d.coffees[q];if(!c)throw Error();render(c)}).catch(()=>{app.innerHTML='<section class="hero"><h1>No encontramos este café</h1><p><a href="../archive/">Volver al archivo</a></p></section>'});</script></body></html>
